name: Release

on:
  workflow_dispatch:
    # Cut a specific version by dispatching with `version` (e.g. `1.0.0`).
    # This is the only way to cross a major line: `cog bump --auto` maps a
    # breaking change to a *minor* bump while on a 0.x line (SemVer treats 0.x
    # as inherently unstable), so it can never reach 1.0.0 from 0.x on its own.
    # When `version` is set the workflow tags + releases that exact version;
    # when empty (the default, and always on a `push` trigger) it falls back to
    # the normal `cog bump --auto` from the commit history.
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.0). Empty = auto from commits."
        required: false
        default: ""
        type: string
  push:
    branches: [main]

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Analyze commits and determine if release is needed
  check-release:
    name: Analyze commits for release
    # Fork (Friring): this runs on the fork — Friring cuts its own releases
    # (friring-* binaries + GitHub Release) and bumps its in-repo Homebrew
    # formula, both on the built-in GITHUB_TOKEN. Upstream's AUR/Chocolatey/
    # winget publish jobs were removed with their manifests. See FORK.md.
    runs-on: ubuntu-latest
    outputs:
      # Gated by BOTH the commit-type decision (`parse`) and the
      # artifact-relevance gate (`shipped`): a `feat`/`fix` that touches only
      # the website, docs, or CI config bumps nothing shippable, so it must not
      # cut a release. See the `shipped` step for the rationale + path list.
      should_release: ${{ steps.parse.outputs.should_release == 'true' && steps.shipped.outputs.shipped != 'false' }}
      version: ${{ steps.parse.outputs.version }}
      # The exact `cog bump` args create-tag runs. Computed here in bash (not
      # via a YAML `${{ && || }}` ternary in create-tag) so the forced-version
      # path is deterministic — the ternary form silently fell back to `--auto`
      # when an output briefly evaluated empty, defeating the forced cut.
      bump_args: ${{ steps.parse.outputs.bump_args }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # Full history for cocogitto

      - name: Check for releasable commits
        # Pinned to v4.2.0 (same SHA as the other cocogitto-action steps below);
        # used here in install-only mode to provide the `cog` binary.
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: check
        with:
          install-only: true

      - name: Parse release decision
        id: parse
        env:
          # '' on a push trigger or an empty dispatch; a bare version otherwise.
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          # Two paths pick the target version:
          #
          # 1. Forced (workflow_dispatch with `version`): use it verbatim. This
          #    is how a major cut is made — `cog bump --auto` can't reach 1.0.0
          #    from a 0.x line (breaking maps to minor there), so an explicit
          #    version is the only route across a major boundary.
          # 2. Auto (push, or dispatch with an empty `version`): the next tag
          #    `cog bump --auto` computes from the commits since the last tag.
          #
          # cog prints the next tag (e.g. "v0.99.1") when a bump is due, but a
          # human-readable "No conventional commits…" message when none is. Match
          # only a real semver so that non-bump message never reaches
          # $GITHUB_OUTPUT — writing its multi-line text there previously failed
          # this step (and the whole workflow) on every docs/ci/chore push.
          if [ -n "$FORCED_VERSION" ]; then
            # Strip a leading `v` if the caller included one (UI convenience).
            VERSION="v${FORCED_VERSION#v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            # `cog bump --version` parses a bare semver (no `v`); the tag_prefix
            # in cog.toml re-adds the `v` on the created tag. `version` (above)
            # keeps the `v` because the tag_name / `ref: <tag>` lookups need it.
            echo "bump_args=--version ${VERSION#v} --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "✅ Forced release: $VERSION"
            exit 0
          fi

          RAW="$(cog bump --auto --disable-bump-commit --dry-run 2>/dev/null || true)"
          echo "cog output: $RAW"
          VERSION="$(printf '%s\n' "$RAW" | grep -oE '^v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*' | head -1 || true)"
          if [ -n "$VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "bump_args=--auto --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "✅ Release needed: $VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump_args=--auto --disable-bump-commit" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No releasable commits detected"
          fi

      - name: Check the release touches a shipped artifact
        id: shipped
        if: steps.parse.outputs.should_release == 'true' && inputs.version == ''
        run: |
          # Commit *type* alone over-releases: cocogitto sees `fix`/`feat` and
          # bumps, but Renovate labels a GitHub-Actions pin bump `fix(deps)` and
          # the website is versioned as `feat(ui)`/`fix(ui)`. Those change no
          # byte of the shipped binary, yet each would cut a release (upstream
          # once cut four CSS-only releases in a row, one of them a *minor*).
          # Every such release also re-runs the 4-platform build and bumps the
          # Homebrew formula for a binary that did not change.
          #
          # So gate on the diff as well: release only when something a user
          # actually installs changed. `tests/` is not on the list: a test-only
          # `fix` changes no installed byte either, and with `auto_update` on
          # by default every install would download and swap in the same binary. The range is the whole span since the last
          # tag, NOT this single push — a website-only push landing on top of an
          # unreleased `src/` commit still owes that release.
          #
          # A forced `workflow_dispatch` version skips this gate entirely (the
          # `if:` above): an explicit human cut is always honoured.
          SHIPPED_PATHS='^(src/|build\.rs$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|Cross\.toml$|extensions/|packaging/|scripts/install\.(sh|ps1)$|\.github/workflows/cd\.yml$)'

          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$LAST_TAG" ]; then
            # No tag yet: nothing to diff against, so the first release always
            # ships. Reported as a single pseudo-path so the decision below
            # stays a plain "is RELEVANT empty?" test for both branches.
            LAST_TAG="(none)"
            RELEVANT="(no previous tag — first release)"
          else
            echo "Files changed since $LAST_TAG:"
            git diff --name-only "$LAST_TAG"..HEAD | sed 's/^/  /'
            RELEVANT="$(git diff --name-only "$LAST_TAG"..HEAD | grep -E "$SHIPPED_PATHS" || true)"
          fi

          if [ -n "$RELEVANT" ]; then
            echo "shipped=true" >> "$GITHUB_OUTPUT"
            echo "✅ Shipped artifact changed — releasing:"
            printf '%s\n' "$RELEVANT" | sed 's/^/  /'
          else
            echo "shipped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release ${{ steps.parse.outputs.version }} — no shipped artifact changed since $LAST_TAG (docs/website/CI only). The commits stay in history and ride along with the next real release."
          fi

  # Create git tag (only if release needed)
  create-tag:
    name: Create release tag
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push the version tag
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create version tag
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: bump
        with:
          command: bump
          # `bump_args` is resolved by check-release: `--version <v>` for a
          # forced cut (the only way across a major boundary on a 0.x line),
          # `--auto` otherwise. Computed in bash upstream to stay deterministic.
          args: ${{ needs.check-release.outputs.bump_args }}
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'

      - name: Push tag to repository
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true

  # Build binaries for all platforms (only if tag created)
  build:
    name: Build ${{ matrix.target }}
    needs: [check-release, create-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary
        shell: bash
        env:
          FRIRING_RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Unix archive: .tar.gz with the bare binaries + LICENSE.
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="friring-${VERSION}-${TARGET}.tar.gz"

          # Stage LICENSE next to the binaries so a single `tar czf` ships all
          # three. (`tar --append` cannot operate on a gzip archive, so the old
          # two-step append silently omitted LICENSE.) No `|| true`: a packaging
          # failure must fail the job.
          cp LICENSE "target/$TARGET/release/"
          cd target/$TARGET/release
          tar czf "../../../$ARCHIVE_NAME" friring friring-cli LICENSE
          cd ../../..

      # Windows archive: .zip with the .exe binaries + LICENSE. install.ps1
      # extracts this with the built-in Expand-Archive (no tar dependency).
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.check-release.outputs.version }}"
          $target = "${{ matrix.target }}"
          $archive = "friring-$version-$target.zip"
          $rel = "target/$target/release"
          Compress-Archive -Force -DestinationPath $archive -Path `
            "$rel/friring.exe", "$rel/friring-cli.exe", "LICENSE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            friring-*.tar.gz
            friring-*.zip
          if-no-files-found: error

  # Generate checksums for all binaries
  checksums:
    name: Generate checksums
    needs: [check-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          cd artifacts

          # Flatten directory structure (tar.gz for Unix, zip for Windows)
          find . \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;

          # Generate checksums over every release archive
          sha256sum friring-*.tar.gz friring-*.zip > "friring-${VERSION}-checksums.txt"

          cat "friring-${VERSION}-checksums.txt"

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/friring-*-checksums.txt

  # Generate CHANGELOG from commits
  generate-changelog:
    name: Generate changelog
    needs: [check-release, create-tag]
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.stdout }}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.check-release.outputs.version }}
          fetch-depth: 0

      - name: Generate changelog for release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        id: changelog
        with:
          command: changelog
          args: --at ${{ needs.check-release.outputs.version }}

  # Publish GitHub Release
  publish:
    name: Publish GitHub Release
    needs: [check-release, create-tag, build, checksums, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          find artifacts -type f -name "*checksums.txt" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.check-release.outputs.version }}
          name: friring ${{ needs.check-release.outputs.version }}
          body: |
            ${{ needs.generate-changelog.outputs.changelog || '## Changes

            See commit history for details.' }}
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the Homebrew formula.
  #
  # This repo doubles as its own tap — Homebrew reads formulae from a tap's
  # `HomebrewFormula/` directory — so "publishing" is just bumping the formula
  # on `main` to the release that was cut above:
  #
  #   brew tap bvc3at/friring https://github.com/bvc3at/friring
  #   brew install friring
  #
  # Runs after `publish` so the release tarballs + checksums.txt exist. The bump
  # lands as a `chore` commit (not releasable to cocogitto) carrying `[skip ci]`,
  # so pushing it back to `main` cannot start another release.
  publish-homebrew:
    name: Publish Homebrew formula
    needs: [check-release, create-tag, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push the formula bump to main
    steps:
      # Checked out at `main`, not at the tag: the bump is a new commit on the
      # branch tap users track. persist-credentials (default) leaves the token
      # in place for the push. Full history (like `create-tag`) so the rebase
      # below always has a merge base, whatever `main` did while the release
      # was building.
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download release checksums
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          # Downloaded outside the work tree so the bump commit stays formula-only.
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}/friring-${VERSION}-checksums.txt"
          cat "${RUNNER_TEMP}/checksums.txt"

      - name: Bump formula to the release version
        run: |
          python3 packaging/homebrew/bump-formula.py \
            "${{ needs.check-release.outputs.version }}" \
            HomebrewFormula/friring.rb \
            "${RUNNER_TEMP}/checksums.txt"
          cat HomebrewFormula/friring.rb

      - name: Push the bump to main
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          if git diff --quiet -- HomebrewFormula/friring.rb; then
            echo "Formula already up to date; nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(fork): bump Homebrew formula to ${VERSION} [skip ci]" \
            -- HomebrewFormula/friring.rb
          # `main` may have moved while the release was building; rebase once
          # rather than failing a published release on a benign race.
          git pull --rebase origin main
          git push origin HEAD:main
