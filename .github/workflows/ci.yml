name: CI

on:
  pull_request:
    branches: [main]
  # The merge queue re-runs the full suite against the temporary
  # `gh-readonly-queue/*` branch (PR rebased onto main). Without this trigger the
  # required "All Checks" gate never reports on a queued PR and it stalls until
  # the queue's check timeout, so the queue *needs* this to merge anything.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel a superseded run when a new commit is pushed to the same PR, so rapid
# re-pushes don't pile up parallel runs of the (heavy) Rust matrix. Each merge
# queue entry gets a distinct `github.ref`, so queued runs never cancel each
# other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff into file-category outputs the other jobs gate on, so a
  # docs-only (or shell-only, website-only, …) PR skips the irrelevant jobs.
  # Job-level `if:` (not workflow-level `paths-ignore:`) is required so the
  # always-run `all-checks` gate still reports a status — a skipped job reports
  # `skipped`, which `all-checks` treats as success.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Fork (Friring): a PRIVATE repo's default GITHUB_TOKEN lacks
    # pull-requests:read, which dorny/paths-filter needs (else "Resource not
    # accessible by integration"). Upstream is public, so it works without this.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust || steps.all.outputs.all }}
      shell: ${{ steps.filter.outputs.shell || steps.all.outputs.all }}
      markdown: ${{ steps.filter.outputs.markdown || steps.all.outputs.all }}
      website: ${{ steps.filter.outputs.website || steps.all.outputs.all }}
      install_sh: ${{ steps.filter.outputs.install_sh || steps.all.outputs.all }}
      install_ps: ${{ steps.filter.outputs.install_ps || steps.all.outputs.all }}
      media: ${{ steps.filter.outputs.media || steps.all.outputs.all }}
      agent_e2e: ${{ steps.filter.outputs.agent_e2e || steps.all.outputs.all }}
      sandbox_probe: ${{ steps.filter.outputs.sandbox_probe || steps.all.outputs.all }}
      omx: ${{ steps.filter.outputs.omx || steps.all.outputs.all }}
    steps:
      # A merge queue entry already contains exactly the PR's changes; validate
      # the whole suite against it rather than diffing (paths-filter has no PR
      # base on a `merge_group` event). Every filter output falls back to this.
      - id: all
        if: github.event_name == 'merge_group'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Every filter includes `.github/workflows/ci.yml` so editing the
          # workflow re-runs all jobs — any job's definition may have changed.
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'deny.toml'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '.shellcheckrc'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.rumdl.toml'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - 'eleventy.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            install_sh:
              - 'scripts/install.sh'
              - 'scripts/install.bats'
              - '.github/workflows/ci.yml'
            install_ps:
              - 'scripts/install.ps1'
              - 'scripts/install.Tests.ps1'
              - '.github/workflows/ci.yml'
            media:
              - 'docs/media/**'
              - 'scripts/demo/**'
              - '.github/workflows/ci.yml'
            agent_e2e:
              - 'scripts/dev/agent-e2e/**'
              - 'scripts/dev/lib/**'
              - 'src/**'
              - 'extensions/hooks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            sandbox_probe:
              - 'scripts/dev/sandbox-probes/**'
              - 'scripts/dev/bridge-e2e.sh'
              - 'scripts/dev/lib/**'
              - 'src/sandbox/**'
              - 'src/agent/sandboxing.rs'
              - 'src/app/bridge*.rs'
              - 'src/cli/sandbox.rs'
              - 'extensions/bridge-conformance/**'
              - '.github/workflows/ci.yml'
            omx:
              - 'extensions/omx/**'
              - 'extensions/bridge-conformance/**'
              - 'tests/omx_manifest_invocation.rs'
              - '.github/workflows/ci.yml'

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check --all

  fmt:
    name: Rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Sharded deliberately (fork): the unsplit `cargo nextest run --all` takes the
  # runner VM down ~53 min in — the step stays `in_progress`, the job reports
  # `failure`, and there is no log blob and no runner `system.txt`, so nothing
  # from inside the job survives to say why. A `timeout` bound set well below
  # that point does not survive either. Split four ways, every one of the 2701
  # tests passes in seconds. See FORK.md.
  nextest:
    name: Nextest (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not cancel the other three — which shards fail is
      # the signal that separates a real test failure from the whole-suite death.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # The shards build identical artifacts and differ only in which tests
          # they run, so they share one cache entry instead of storing four.
          shared-key: nextest
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-nextest
      # `count:` partitions by test count in listing order: the four shards are
      # disjoint and together cover the suite exactly once.
      - run: cargo nextest run --all --profile ci --partition count:${{ matrix.shard }}/4

  # Native-Windows gate (psmux backend selection, known-folder paths, toast
  # notifications, junction workspaces), split into two parallel jobs so the heavy
  # Windows compile isn't serialized: clippy-driver and rustc don't share
  # artifacts, so a single job ran two back-to-back full builds (~9 min). The
  # separate `cargo check` pass was dropped — `clippy -D warnings` already
  # type-checks, so it covers the compile gate. Each job excludes the build dirs
  # from Defender real-time scanning, the dominant Windows-runner overhead (it
  # scans every .rlib/.exe cargo writes). The local dockur VM
  # (scripts/dev/e2e/windows-vm.sh test-suite) runs the same suite from a
  # cross-built nextest archive; these jobs are the automated mirror.
  windows-clippy:
    name: Windows (clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --all-targets --all-features -- -D warnings

  windows-test:
    name: Windows (tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-nextest
      # --no-fail-fast: surface every native-Windows test failure in one run
      # (the `ci` profile is fail-fast); easier to triage runner-specific issues.
      - run: cargo nextest run --all --profile ci --no-fail-fast

  architecture:
    name: Architecture Rules
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --test architecture_rules

  tui-smoke:
    name: TUI Smoke Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Black-box TUI smoke test
        run: scripts/dev/smoke/tui-smoke.sh

  # Observe the deny set against a real kernel rather than against generated
  # policy text. Non-blocking like agent-e2e: a hosted runner's namespace and
  # socket capabilities are the runner's, not friring's, and the probes skip
  # rather than fail where one is absent — but a *failure* here is a real hole
  # and shows up in the run.
  seatbelt-probe:
    name: Seatbelt Boundary Probe (macOS)
    needs: changes
    if: needs.changes.outputs.sandbox_probe == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install tmux
        run: brew install tmux
      - name: Observe the seatbelt boundary
        run: scripts/dev/sacrificial-env.sh scripts/dev/sandbox-probes/seatbelt.sh

  bwrap-probe:
    name: Bubblewrap Boundary Probe (Linux)
    needs: changes
    if: needs.changes.outputs.sandbox_probe == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install tmux and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y tmux bubblewrap
      - name: Observe the bubblewrap boundary
        run: scripts/dev/sacrificial-env.sh scripts/dev/sandbox-probes/bwrap.sh

  # The orchestration bridge, end to end against a real TUI: a leader created
  # through the wizard, a child through the saga, a verdict friring reached by
  # reading a worktree. Non-blocking for the same reason the probes are — it
  # needs bubblewrap and a usable user namespace, and skips where either is
  # absent — but a *failure* here is a bridge that does not work.
  # Run through `sacrificial-env.sh`, which mints a throwaway outer HOME whose
  # friring fallback paths are canaries, and fails the job if anything writes to
  # one. A runner's HOME is disposable, so this buys little here; it is the same
  # command a developer runs locally, where it buys a great deal.
  bridge-e2e:
    name: Bridge Conformance E2E (Linux)
    needs: changes
    if: needs.changes.outputs.sandbox_probe == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install tmux, bubblewrap and jq
        run: sudo apt-get update && sudo apt-get install -y tmux bubblewrap jq
      - name: Run the conformance extension end to end
        run: scripts/dev/sacrificial-env.sh scripts/dev/bridge-e2e.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-e2e
          path: target/bridge-e2e/
          if-no-files-found: ignore

  # The omx extension's own program tests. Node is on every hosted runner, so
  # this is an ordinary blocking job rather than a skip-if-absent one.
  omx-tests:
    name: OMX Extension Tests
    needs: changes
    if: needs.changes.outputs.omx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Run the extension's program tests
        run: node --test "extensions/omx/lib/*.test.mjs"

  acceptance:
    name: Acceptance Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-nextest
      - name: Run TUI acceptance (e2e) tests
        run: cargo nextest run --profile ci -E 'test(app::acceptance::)'

  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check ${{ matrix.checks }}
          log-level: warn

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check

  markdown-lint:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Lint markdown files
        uses: rvben/rumdl@c6fa6612be03d6dd87812a1e6eb904cbbf1d9dce # v0.2.27
        with:
          report-type: annotations

  # Fork (Friring): the demo media is recorded by hand on a workstation, so
  # nothing else would notice a clip that regressed into holding a frozen frame
  # for seconds — the failure is invisible in a diff (the gif is binary) and
  # invisible in a review (nobody plays ten gifs). Measure it instead.
  demo-pacing:
    name: Demo Pacing Budget
    needs: changes
    if: needs.changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Only the opening-hold metric shells out to ffmpeg; the rest is read
      # straight from the gifs' own frame delays.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check demo pacing budget
        run: node scripts/demo/lib/check-pacing.mjs docs/media/*.gif
      # Fork (Friring): the agent-e2e clips are gated too, on the profile that
      # relaxes ONLY the two metrics real agent latency explains (held frame,
      # opening) to a measured ceiling. The size cap and the blank-final-frame
      # backstop are not relaxed at all: neither becomes acceptable because
      # there was an agent in the pane, and both catch defects a reviewer never
      # would (a gif over GitHub's limit does not render; a leaked teardown is
      # perfectly well-paced). See docs/media/fork/README.md.
      - name: Check fork-clip pacing budget
        run: node scripts/demo/lib/check-pacing.mjs --profile=agent docs/media/fork/*.gif

  install-script:
    name: Install Script Tests
    needs: changes
    if: needs.changes.outputs.install_sh == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run install script tests
        run: bats scripts/install.bats

  install-script-ps:
    name: Install Script Tests (PowerShell)
    needs: changes
    if: needs.changes.outputs.install_ps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # pwsh is preinstalled on GitHub-hosted runners. The install.ps1 helpers
      # are platform-independent (the tests set PROCESSOR_ARCHITECTURE
      # themselves), so they run on ubuntu rather than needing a windows runner.
      - name: Run install.ps1 helper tests (Pester)
        shell: pwsh
        run: |
          $mod = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $mod -or $mod.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'scripts/install.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  website-lint:
    name: Website Lint
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Page .html sources carry YAML front matter and are partial Eleventy
      # templates, so Prettier/HTMLHint run on the CSS/JS sources and on the
      # built _site output rather than the page sources. lint:website builds
      # the site first, then runs every linter.
      - name: Lint website
        run: npm run lint:website

  sonarqube:
    name: SonarQube
    needs: changes
    # Fork (Friring): SonarQube is deferred — not set up for the fork at the
    # moment (no SonarCloud project/token), so this runs only on upstream for
    # now. A skipped job still counts as success for the `all-checks` gate below
    # (it fails only on 'failure'/'cancelled'). See FORK.md.
    if: needs.changes.outputs.rust == 'true' && github.repository == 'Thurbeen/thurbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Informational only — tracks the release binary size so growth is visible in
  # the PR. Deliberately NOT in `all-checks.needs`, so it never blocks a merge.
  # See docs/PERFORMANCE.md (memory / binary size).
  binary-size:
    name: Binary Size
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binaries
        run: cargo build --release --bins
      - name: Record binary sizes
        run: |
          {
            echo "### Release binary sizes"
            echo ""
            echo "| Binary | Size |"
            echo "| ------ | ---- |"
            for bin in friring friring-cli; do
              path="target/release/$bin"
              [ -f "$path" ] || continue
              size=$(du -h "$path" | cut -f1)
              bytes=$(stat -c%s "$path")
              echo "| \`$bin\` | $size ($bytes bytes) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            target/release/friring
            target/release/friring-cli
          if-no-files-found: warn

  # Real-agent e2e (fork-only): the pinned Claude Code binary against the local
  # model stub, driven through the real TUI (scripts/dev/agent-e2e/, see
  # docs/E2E.md). Deliberately NOT in `all-checks.needs`, so it never blocks a
  # merge — it exercises an externally-pinned binary, and its failures need a
  # human eye (conformance drift vs real regression).
  agent-e2e:
    name: Real-Agent E2E
    needs: changes
    if: needs.changes.outputs.agent_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install tmux + bats
        run: sudo apt-get update && sudo apt-get install -y tmux bats
      - name: Install pinned Claude Code
        # The pin is the binary version the fixtures were conformance-tested
        # against; bump it deliberately and re-run the suite locally first
        # (docs/E2E.md, "Updating the pinned agent binary"). The version check
        # fails the job fast on a broken install — without it the suite would
        # SKIP (dev-machine semantics) and report a false green.
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.215
          claude --version
      - name: Run real-agent e2e suite
        run: scripts/dev/agent-e2e/run.sh
      - name: Surface unexpected-endpoint drift
        # Non-message endpoints the pinned binary hits that the stub didn't
        # expect (a new telemetry/config probe on a version bump) are harmless
        # — the suite still passes — but should be visible, not silent. A
        # warning annotation flags them without failing the job.
        if: always()
        run: |
          f=target/agent-e2e/unexpected-endpoints.log
          if [ -f "$f" ]; then
            echo "::warning title=Agent API drift::agent-e2e saw unexpected non-message endpoint(s) — review before the next pin bump (docs/E2E.md)"
            cat "$f"
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-e2e-artifacts
          path: target/agent-e2e/artifacts
          if-no-files-found: warn

  all-checks:
    name: All Checks
    if: always()
    needs:
      - changes
      - check
      - fmt
      - clippy
      - nextest
      - acceptance
      - architecture
      - windows-clippy
      - windows-test
      - tui-smoke
      - deny
      - docs
      - conventional-commits
      - markdown-lint
      - demo-pacing
      - install-script
      - install-script-ps
      - shellcheck
      - website-lint
      - sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
