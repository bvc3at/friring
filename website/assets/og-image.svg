<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Friring — TUI Agentic IDE">
  <!-- Source for assets/og-image.png (1200x630 social preview). Rasterize with
       scripts/dev/render-og-image.sh after editing. Brand colors mirror
       website/css/variables.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15120f"/>
      <stop offset="1" stop-color="#1e1a16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ff5c54"/>

  <!-- logo mark (from website/assets/logo-mark.svg), scaled and centered top -->
  <g transform="translate(540 70) scale(2.0)">
    <rect x="6" y="7" width="52" height="27" rx="8" fill="#1a080a"/>
    <rect x="7.25" y="8.25" width="49.5" height="24.5" rx="6.75" fill="none" stroke="#ff5c54" stroke-width="2.5"/>
    <text x="17.2" y="23.3" font-family="'JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',monospace" font-size="12.4" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#6eff6e">$</text>
    <rect x="31" y="20.5" width="12" height="5.5" rx="1" fill="#6eff6e"/>
    <path d="M32 34 V36.5" fill="none" stroke="#ff5c54" stroke-width="2.2" stroke-linecap="round"/>
    <g transform="translate(32 47.5) scale(0.82) translate(-32 -47.5)">
      <g transform="translate(-2.2 2.0)">
        <path fill="#ff5c54" d="
          M32 53
          C28.4 53 25.9 50.7 25.9 47.7
          C25.9 45.7 26.9 43.9 28.4 42.2
          C28.7 43.5 29.6 44.6 30.8 45.3
          C30.8 42.5 31.9 40.1 33.7 38.0
          C34.2 40.3 35.5 42.2 37.2 43.6
          C38.0 42.4 39.0 41.3 40.1 40.3
          C41.8 42.3 42.9 44.8 42.9 47.4
          C42.9 50.7 39.1 53 35.7 53
          Z"/>
        <path fill="#ffb627" d="
          M33.4 51.7
          C30.9 51.7 29.1 50.1 29.1 48.0
          C29.1 46.5 29.8 45.2 31.0 44.0
          C31.3 44.9 31.9 45.6 32.6 46.1
          C32.8 44.2 33.6 42.6 34.8 41.2
          C35.2 42.6 36.0 43.7 37.1 44.6
          C37.7 43.8 38.3 43.1 39.0 42.5
          C40.2 43.9 40.9 45.5 40.9 47.2
          C40.9 49.9 38.8 51.7 36.1 51.7
          Z"/>
      </g>
    </g>
    <circle cx="32" cy="47.5" r="12" fill="none" stroke="#ff5c54" stroke-width="2.2"/>
    <circle cx="20" cy="47.5" r="4.4" fill="#1a080a" stroke="#6eff6e" stroke-width="2.2"/>
    <circle cx="44" cy="47.5" r="4.4" fill="#1a080a" stroke="#ffb627" stroke-width="2.2"/>
    <circle cx="32" cy="58.6" r="4" fill="#1a080a" stroke="#ff5c54" stroke-width="2.2"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="360" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="96" font-weight="700" letter-spacing="-2">
    <tspan fill="#f5e6e0">fri</tspan><tspan fill="#ff5c54">ring</tspan>
  </text>

  <!-- tagline -->
  <text x="600" y="430" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="40" font-weight="700" fill="#6eff6e">TUI Agentic IDE</text>

  <!-- subtitle -->
  <text x="600" y="500" text-anchor="middle" font-family="'Inter','DejaVu Sans',sans-serif" font-size="30" fill="#a0a0a0">Run any coding-agent CLI in persistent tmux panes</text>
</svg>
