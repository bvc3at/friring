<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 32px reduction of website/assets/logo-mark.svg: the whole tile is the
       shell, with the flame ring inside it. The flame group is the mark's own,
       mapped from 64-space onto the ring at (16,22) by the outer transform. -->
  <rect width="32" height="32" rx="7" fill="#1a080a"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="#ff5c54" stroke-width="1.5"/>
  <text x="8.6" y="11.6"
        font-family="'JetBrains Mono', 'Cascadia Mono', 'DejaVu Sans Mono', monospace"
        font-size="10" font-weight="700"
        text-anchor="middle" dominant-baseline="middle"
        fill="#6eff6e">$</text>
  <rect x="14" y="8.5" width="7" height="4" rx="0.8" fill="#6eff6e"/>
  <path d="M16 15 V16" fill="none" stroke="#ff5c54" stroke-width="1.4" stroke-linecap="round"/>

  <!-- flame first, then ring over it -->
  <g transform="translate(0 -1.75) scale(0.5)">
    <g transform="translate(32 47.5) scale(0.82) translate(-32 -47.5)">
      <g transform="translate(-2.2 2.0)">
        <path fill="#ff5c54" d="
          M32 53
          C28.4 53 25.9 50.7 25.9 47.7
          C25.9 45.7 26.9 43.9 28.4 42.2
          C28.7 43.5 29.6 44.6 30.8 45.3
          C30.8 42.5 31.9 40.1 33.7 38.0
          C34.2 40.3 35.5 42.2 37.2 43.6
          C38.0 42.4 39.0 41.3 40.1 40.3
          C41.8 42.3 42.9 44.8 42.9 47.4
          C42.9 50.7 39.1 53 35.7 53
          Z"/>
        <path fill="#ffb627" d="
          M33.4 51.7
          C30.9 51.7 29.1 50.1 29.1 48.0
          C29.1 46.5 29.8 45.2 31.0 44.0
          C31.3 44.9 31.9 45.6 32.6 46.1
          C32.8 44.2 33.6 42.6 34.8 41.2
          C35.2 42.6 36.0 43.7 37.1 44.6
          C37.7 43.8 38.3 43.1 39.0 42.5
          C40.2 43.9 40.9 45.5 40.9 47.2
          C40.9 49.9 38.8 51.7 36.1 51.7
          Z"/>
      </g>
    </g>
  </g>

  <circle cx="16" cy="22" r="6" fill="none" stroke="#ff5c54" stroke-width="1.6"/>
  <circle cx="10" cy="22" r="2.2" fill="#1a080a" stroke="#6eff6e" stroke-width="1.5"/>
  <circle cx="22" cy="22" r="2.2" fill="#1a080a" stroke="#ffb627" stroke-width="1.5"/>
  <circle cx="16" cy="28" r="2" fill="#1a080a" stroke="#ff5c54" stroke-width="1.5"/>
</svg>
