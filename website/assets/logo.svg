<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" role="img" aria-label="friring">
  <defs>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- mark: shell box feeding a fire ring -->
  <g id="mark">
    <!-- shell -->
    <rect x="6" y="7" width="52" height="27" rx="8" fill="#1a080a"/>
    <rect x="7.25" y="8.25" width="49.5" height="24.5" rx="6.75"
          fill="none" stroke="#ff5c54" stroke-width="2.5"/>
    <text x="13" y="28" class="mono" font-size="15" fill="#6eff6e">$</text>
    <rect x="31" y="20.5" width="12" height="5.5" rx="1" fill="#6eff6e"/>

    <!-- connector -->
    <path d="M32 34 V36.5"
          fill="none" stroke="#ff5c54" stroke-width="2.2" stroke-linecap="round"/>

    <!-- fire ring -->
    <circle cx="32" cy="47.5" r="12"
            fill="none" stroke="#ff5c54" stroke-width="2.2"/>

    <!-- ring nodes -->
    <circle cx="20" cy="47.5" r="4.4"
            fill="#1a080a" stroke="#6eff6e" stroke-width="2.2"/>
    <circle cx="44" cy="47.5" r="4.4"
            fill="#1a080a" stroke="#ffb627" stroke-width="2.2"/>
    <circle cx="32" cy="58.6" r="4.0"
            fill="#1a080a" stroke="#ff5c54" stroke-width="2.2"/>

    <!-- flame -->
    <path fill="#ff5c54"
          d="M32 55.4
             c-3.8 0-6.8-2.2-8.1-5.6
             c-0.5-1.4-0.6-2.8-0.3-4.1
             c0.4-1.8 1.5-3.6 3.1-5.5
             c0.4 1.3 1.3 2.4 2.4 3.2
             c0.4-3.0 2.0-5.9 4.2-8.0
             c0.4 2.4 1.8 4.6 3.8 6.0
             c0.9-1.5 2.0-2.8 3.3-4.0
             c1.7 1.9 2.8 4.4 2.8 7.1
             c0 4.6-3.4 8.2-7.9 8.2z"/>
    <path fill="#ffb627"
          d="M32 52.8
             c-2.2 0-3.9-1.3-3.9-3.4
             c0-1.4 0.6-2.8 1.7-4.0
             c0.2 0.8 0.7 1.5 1.3 2.0
             c0.4-1.8 1.3-3.5 2.6-4.8
             c0.3 1.3 1.2 2.5 2.2 3.3
             c0.6-0.8 1.2-1.5 1.9-2.2
             c1.0 1.2 1.7 2.8 1.7 4.5
             c0 2.8-2.1 4.6-4.5 4.6z"/>
  </g>

  <!-- wordmark -->
  <text x="76" y="44" class="mono" font-size="34" letter-spacing="-1">
    <tspan fill="#f5e6e0">fri</tspan><tspan fill="#ff5c54">ring</tspan>
  </text>

  <!-- trailing cursor -->
  <rect x="234" y="22" width="11" height="26" rx="1.5" fill="#6eff6e"/>
</svg>
