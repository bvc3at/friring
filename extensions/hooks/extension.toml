# The built-in "hooks" extension.
#
# Wires each coding agent's lifecycle hooks to `friring-cli session signal` so
# every session reports its state (working / blocked / done) back to friring.
# Unlike user extensions this one ships embedded in the binary and is
# auto-activated on first run. Opt out with:
#
#     friring-cli extension deactivate hooks
#
# Identity is the injected $FRIRING_SESSION env var (no ids passed by hand), and
# every hook command is `… || true` so a missing friring-cli or a hook firing
# outside a friring session can never break the agent.

name = "hooks"
description = "Report each agent's lifecycle state (working/blocked/done) to friring via agent hooks."
config_version = 1
version = "1.4.0"
# Default home; the auto-activation path overrides this with *this build's*
# resolved config dir (`~/.config/friring` or `~/.config/friring-dev`) so dev and
# release installs stay isolated. See `session_ops::builtin_hooks::hooks_home`.
home = "~/.config/friring/hooks"

# claude reads hooks from a settings file we pass via --settings (merged with the
# user's own settings, never clobbering them). The file lives under the home dir.
[[files]]
path = "claude.json"

# Inject the --settings flag into the existing built-in `claude` agent (reversible).
[[agent_patches]]
name = "claude"
append_args = ["--settings", "{home}/claude.json"]

# aider has no lifecycle hook system — only a "waiting for input" callback, which
# maps to blocked. (working/done aren't expressible; the dot stays accurate for
# the block edge.)
[[agent_patches]]
name = "aider"
append_args = [
  "--notifications",
  "--notifications-command",
  "friring-cli session signal --state blocked",
]

# opencode loads plugins from its own config dir; drop one in (only when opencode
# is actually installed, guarded by requires_dir).
[[external_files]]
path = "~/.config/opencode/plugin/friring-status.js"
source = "opencode-status.js"
requires_dir = "~/.config/opencode"

# codex now has a claude-shaped hooks.json (SessionStart/UserPromptSubmit/
# PreToolUse/Stop) loaded from ~/.codex/hooks.json — strictly richer than the
# old `notify` (which only fired agent-turn-complete → done). We JSON-merge our
# entries into that file (reversibly; uninstall prunes exactly ours by the
# `session signal` marker, leaving the user's hooks intact), guarded by
# requires_dir so it's a no-op when codex isn't installed. Events: SessionStart
# → idle, UserPromptSubmit/PreToolUse → working, Stop → done. No `blocked` —
# codex's top-level hooks have no permission/approval event (that lives only in
# the legacy `notify`). Replaces the old `-c notify=…` patch (avoiding a
# double-`done` signal); the trade is a reversible write into a separate
# ~/.codex/hooks.json — never the user's config.toml.
#
# The event names are verified against codex-cli 0.145.0, as are two contract
# details the payload depends on (the first is asserted by the codex-text-turn
# e2e scenario):
#
#   1. Hook stdout MUST be empty or a JSON object codex's per-event schema
#      accepts — anything else fails the hook and codex reports "hook returned
#      invalid <event> JSON output" in the pane on every event. `friring-cli`
#      renders JSON whenever stdout is not a TTY (cli::output::Format::resolve),
#      which a hook's piped stdout always is, so every command here redirects
#      stdout (and stderr, which codex surfaces too) to /dev/null.
#   2. codex gates hooks behind a per-entry trust prompt keyed on the command
#      string: on first launch after an install (or after this payload changes)
#      it parks on "Hooks need review" and the hooks stay inert until the user
#      accepts. Nothing friring can pre-seed — the hash lives in the user's
#      codex config.toml.
#
# If a future codex changes the schema, edit codex-hooks.json (no code change).
[[config_merges]]
path = "~/.codex/hooks.json"
source = "codex-hooks.json"
requires_dir = "~/.codex"

# vibe (Mistral Vibe) loads hooks from ~/.vibe/hooks.toml. It's TOML, so we
# can't JSON-merge it — we drop a managed file in (only when vibe is installed,
# guarded by requires_dir). If the user already maintains their own
# ~/.vibe/hooks.toml, the write is refused (no managed marker), so we never
# clobber it — vibe just goes unreported rather than broken.
#
# EXPERIMENTAL: the hooks.toml schema is not verified against the live `vibe`
# binary. If event/key names differ, edit vibe-hooks.toml (no code change).
# Events: before_tool → working, after_turn → done, notification → blocked.
[[external_files]]
path = "~/.vibe/hooks.toml"
source = "vibe-hooks.toml"
requires_dir = "~/.vibe"

# GitHub Copilot CLI (the `copilot` command) loads hooks from its own dir,
# ~/.copilot/hooks/*.json (each file loaded alphabetically), so we drop a managed
# standalone file in — never touching the user's other hook files. Guarded by
# requires_dir so it's a no-op when copilot isn't installed; the hooks/ subdir is
# created automatically. Events (copilot's own schema, see
# https://docs.github.com/en/copilot/reference/hooks-configuration):
# sessionStart → idle, userPromptSubmitted/preToolUse → working, agentStop →
# done, and notification (matched to `permission_prompt`) → blocked. Both `bash`
# and `powershell` commands are shipped so status works on Windows too. The
# `session signal` JSON output carries none of copilot's decision keys
# (permissionDecision/decision/additionalContext), so it never affects the
# preToolUse/agentStop fail-open flow. If a future copilot changes the schema,
# edit copilot-hooks.json (no code change).
[[external_files]]
path = "~/.copilot/hooks/friring-status.json"
source = "copilot-hooks.json"
requires_dir = "~/.copilot"

# antigravity (the `agy` CLI, the Gemini CLI successor) loads hooks only from its
# shared ~/.gemini/settings.json, which we must NOT clobber — so we JSON-merge our
# entries in (reversibly; uninstall prunes exactly ours, leaving the user's
# settings intact). Guarded by requires_dir so it's a no-op when antigravity isn't
# installed.
#
# `agy` adopted Claude Code's hook schema (verified against agy 1.0.9): the event
# names live in antigravity-hooks.json and map SessionStart→idle, PreToolUse→
# working, Stop→done, and Notification→blocked (payload-parsed for permission/
# approval, like claude, so an idle Notification doesn't flip the dot red). It has
# no UserPromptSubmit, so working is signaled at the first tool call. If a future
# agy changes the schema, fix antigravity-hooks.json (no code change needed).
# Identity needs $FRIRING_SESSION to reach the hook process; if agy sanitizes the
# hook env the signal is a fail-open no-op (`|| true`).
[[config_merges]]
path = "~/.gemini/settings.json"
source = "antigravity-hooks.json"
requires_dir = "~/.gemini"
