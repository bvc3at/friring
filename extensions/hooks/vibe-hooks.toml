# Managed by friring `extension install` (the built-in "hooks" extension).
# Reinstalling or updating overwrites this file — do not edit; uninstalling
# removes it. Reports Mistral Vibe's lifecycle state to friring via
# `friring-cli session signal`, or — inside a sandbox, where that binary need
# not exist and the database is out of reach by design — by appending the state
# to $FRIRING_SIGNAL_FILE, which friring polls (docs/SANDBOX.md §Status
# signals). Identity comes from the inherited $FRIRING_SESSION env var; every
# call is best-effort (`|| true`) so it can never break a session running
# outside friring.
#
# Verified against vibe 2.21.0 (`vibe.core.hooks.models.HookConfig`). Vibe's
# hook schema is TOML with one `[[hooks]]` entry per hook, each requiring a
# `name`, a `type` (one of `pre_tool` / `post_tool` / `post_agent`), and a
# `command` (run via the shell with the invocation JSON on stdin; the parent
# env is inherited, so $FRIRING_SESSION travels). If a future vibe renames the
# types or fields, edit this file (no code change) — a wrong name just means
# the state isn't reported (vibe logs a per-hook config issue and skips it;
# the `|| true` keeps vibe itself safe).
#
# Vibe exposes only those three hook types — there is no permission/
# notification event — so `blocked` is **not** reported. `pre_tool` fires
# *before* the tool-approval prompt (agent_loop `_run_pre_tool_pipeline` runs
# ahead of `_should_execute_tool`), so a tool awaiting approval still reads as
# `working` (accurate: the agent is mid-turn). pre_tool -> working,
# post_agent -> done. post_tool is intentionally unused (redundant with
# pre_tool for the working signal, and carries no turn-end edge).

[[hooks]]
name = "friring-pre-tool"
type = "pre_tool"
command = "if [ -n \"$FRIRING_SIGNAL_FILE\" ]; then printf 'working\\n' >> \"$FRIRING_SIGNAL_FILE\" || true; else friring-cli session signal --state working || true; fi"

[[hooks]]
name = "friring-post-agent"
type = "post_agent"
command = "if [ -n \"$FRIRING_SIGNAL_FILE\" ]; then printf 'done\\n' >> \"$FRIRING_SIGNAL_FILE\" || true; else friring-cli session signal --state done || true; fi"
