name = "omx"
description = "Bridge-backed Team execution for oh-my-codex 0.21.0"
config_version = 1
version = "1.0.0"
# The soft compatibility gate, and deliberately not the real one: the bridge
# this extension needs is gated hard by `[[requires]] binary-capability bridge`
# below, which refuses rather than warns. A floor above the fork's newest
# release would warn on every install for a check the hard gate already makes.
min_thurbox_version = "0.20.0"
home = "~/.config/friring/extensions/omx"

# ── What must hold before this installs ──────────────────────────────────
#
# Every one is a hard gate. An extension whose routing, argv contract and skill
# text were all read from one oh-my-codex release does not work against another,
# and installing it anyway would produce a leader that fails in a way nobody can
# attribute.

# The bridge itself: this extension is nothing without it.
[[requires]]
kind = "binary-capability"
name = "bridge"
version = 1

# oh-my-codex declares `engines.node >= 20`, so this adds no new dependency —
# it states the one the operator already has. The manifest gate proves only that
# `node` is installed and prints a `v`-prefixed version; the exact major bound
# (>= 20) is enforced by the program's `checkNodeVersion`, which compares the
# major numerically and refuses with a message naming the version it found. A
# `tool-version` pattern is a literal boundary match, not a comparison, so it
# cannot express "20 or newer".
[[requires]]
kind = "tool-version"
command = "node"
args = ["--version"]
pattern = "v"

[[requires]]
kind = "tool-version"
command = "omx"
args = ["--version"]
pattern = "0.21.0"

# Evidence the operator ran `omx setup --scope user`. Without it the skills and
# prompts below are not there, and a worker's `copy-rewrite`d hooks file would
# point at nothing.
[[requires]]
kind = "file-contains"
path = "~/.codex/hooks.json"
needle = "codex-native-hook"

