# ── The two agents ───────────────────────────────────────────────────────
#
# Both run a one-line wrapper under `bin/`, never `node` directly, so the
# program always receives its subcommand first and friring's argv after it.
# friring emits the session-selection group before the static `args`
# (`AgentDef::build_args`), so a leader restart arrives as
# `resume --last --direct` — which is the order the pinned `omx` accepts.

[[agents]]
name = "omx-leader"
command = "{home}/bin/omx-leader"
args = ["--direct"]
resume_args = ["resume", "--last"]
resume_latest = true
hook_schema = "codex"

# Where a leader's conversation lands, so `resume --last` is checked rather than
# assumed. See the worker's block below for why the id is not in the name.
[agents.transcript]
dir = "sessions"
suffix = ".jsonl"

[agents.sandbox]
auth = "auto"
config_dir_env = "CODEX_HOME"
state_dir = "~/.codex"
credential_file = "~/.codex/auth.json"
writeback = true
secret_env = ["OPENAI_API_KEY"]
# The exact files codex and OMX write under `~/.codex` — never `~/.codex`
# whole. A leader that could write the whole directory could rewrite the skill
# cards this extension pins.
#
# `~/.omx` and `~/.omx-runs` are here rather than in the profile's `paths`, and
# that placement is the security boundary: a profile path is inherited by every
# bridge child (read-only, after narrowing), and these two hold the leader's
# session identity, its launch lineage, its logs and its codebase map. Declared
# on the *leader agent* they reach the leader — which is the only session that
# needs them — and no worker, because a worker's own agent block does not
# declare them. `omx` creates `~/.omx-runs` before it launches anything, so a
# leader without them dies on EPERM with no pane to say so.
state_rw = [
  "~/.codex/config.toml",
  "~/.codex/auth.json",
  "~/.codex/sessions",
  "~/.codex/log",
  "~/.codex/history.jsonl",
  "~/.codex/.omx-config.json",
  "~/.omx",
  "~/.omx-runs",
]
bypass = ["--madmax"]
bridge_requires = ["child-lifecycle", "mailbox"]

[agents.sandbox.env]
# OMX must not replace itself under a boundary that pinned its version.
OMX_AUTO_UPDATE = "0"
# The routing overlay. `readLaunchAppendInstructions` throws when the file is
# missing, so this fails closed rather than silently launching native Team.
OMX_RALPH_APPEND_INSTRUCTIONS_FILE = "{home}/leader/APPENDIX.md"

[[agents]]
name = "omx-worker-codex"
command = "{home}/bin/omx-worker-codex"
args = []
resume_args = ["resume", "--last"]
# `resume --last` is unambiguous for a worker because its `CODEX_HOME` is
# private: the last conversation in it is its own, and there is no other. A
# bridge `resume` emits this group through
# `app::bridge_saga::child_resume_identity`, so a parked worker comes back to
# the conversation it was having.
resume_latest = true
hook_schema = "codex"

# And what makes that provable: friring refuses a bridge child's resume it
# cannot prove will reach a conversation, rather than starting a blank one under
# the same id. A rollout is `sessions/<yyyy>/<mm>/<dd>/rollout-*.jsonl`; the id
# in that filename is Codex's own and not friring's, so the check is "is there a
# conversation in this directory at all?" — exact here, because the directory is
# this worker's private CODEX_HOME.
[agents.transcript]
dir = "sessions"
suffix = ".jsonl"

[agents.sandbox]
auth = "auto"
config_dir_env = "CODEX_HOME"
state_dir = "~/.codex"
credential_file = "~/.codex/auth.json"
writeback = true
secret_env = ["OPENAI_API_KEY"]
state_rw = [
  "~/.codex/config.toml",
  "~/.codex/auth.json",
  "~/.codex/sessions",
  "~/.codex/log",
  "~/.codex/history.jsonl",
  "~/.codex/.omx-config.json",
]
bypass = ["--dangerously-bypass-approvals-and-sandbox"]
bridge_requires = ["mailbox", "report"]

# What a worker needs in its **private** state directory. `sessions`,
# `history.jsonl` and `log` are in the leader's `state_rw` and therefore in
# every worker's subtract set: a worker's transcripts live only under its own
# `CODEX_HOME`, and no other session's history is readable.
#
# `auth.json` is the one shared file, through a `link-rw` — legal because this
# block declares it as the `credential_file` under `state_dir` with
# `writeback = true`, so a refresh updates the one credential in place rather
# than leaving a worker a private copy (ADR-28).
[[agents.sandbox.child_state_seed]]
src = "auth.json"
mode = "link-rw"
required = true

[[agents.sandbox.child_state_seed]]
src = "config.toml"
mode = "copy"
required = true

# The one seed that has to be rewritten: a hooks file naming `~/.codex/hooks/…`
# would, copied verbatim, point a worker's hooks back at its family's directory
# — the one place its subtract set denies.
[[agents.sandbox.child_state_seed]]
src = "hooks.json"
mode = "copy-rewrite"
required = true

[[agents.sandbox.child_state_seed]]
src = "skills"
mode = "symlink"
required = true

[[agents.sandbox.child_state_seed]]
src = "prompts"
mode = "symlink"
required = true

[[agents.sandbox.child_state_seed]]
src = "AGENTS.md"
mode = "symlink"
required = false

[agents.sandbox.env]
OMX_AUTO_UPDATE = "0"

# ── The two skill cards ──────────────────────────────────────────────────
#
# `refuse` rather than the default `skip`: these are the routing, and an
# install that skipped them would leave a leader running somebody else's card
# under this extension's name.

[[external_files]]
path = "~/.codex/skills/friring-team/SKILL.md"
source = "skills/friring-team/SKILL.md"
requires_dir = "~/.codex/skills"
substitute = true
on_conflict = "refuse"

[[external_files]]
path = "~/.codex/skills/friring-autopilot/SKILL.md"
source = "skills/friring-autopilot/SKILL.md"
requires_dir = "~/.codex/skills"
substitute = true
on_conflict = "refuse"

