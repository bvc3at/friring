[package]
name = "friring"
# Development version marker: real version injected at build time from git tags
version = "0.0.0-dev"
edition = "2021"
# Build script injects version from FRIRING_RELEASE_VERSION env variable (set by CI)
# Fallback to version above for local development builds
build = "build.rs"
# `cargo run` (no --bin) launches the TUI; friring-cli is the headless binary.
default-run = "friring"
authors = ["LeTuR <magicletur@protonmail.com>"]
license = "MIT"
description = "A TUI for orchestrating multiple coding-agent CLI sessions in persistent tmux panels"
repository = "https://github.com/bvc3at/friring"
keywords = ["tui", "agent", "tmux", "git", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# TUI framework
ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3"

# Terminal emulation — resolved through the [patch.crates-io] fork at the
# bottom of this file, which is what lets a normal-screen agent's pane scroll.
vt100 = "0.16"

# Display-width math for clickable-link column positions (wide CJK/emoji cells)
unicode-width = "0.2"

# Markdown parsing (task description rendering)
pulldown-cmark = { version = "0.13", default-features = false }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }

# Session management
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "1.0"
toml_edit = "0.25"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# System metrics
sysinfo = "0.39"

# Error handling
anyhow = "1.0"

# Clipboard (text only — the default `image-data` feature pulls in the
# image/png/moxcms decoding stack we never use; friring only copies/pastes text)
arboard = { version = "3", default-features = false }

# Temporary directories (used by tests and session_ops)
tempfile = "3"

# JSON (session metadata, keybindings, agent config)
serde_json = "1"

# CLI argument parsing (friring-cli)
clap = { version = "4", features = ["derive"] }

# Date/time + cron scheduling (automations)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.17"
serde_ignored = "0.1.14"

# OS notifications. Linux-only: dbus with action callbacks (click-to-focus
# works). macOS dispatches via `terminal-notifier` if installed, else the
# system `osascript` binary — both inside `src/notifications.rs`, neither
# needs notify-rust. notify-rust's macOS backend (`mac-notification-sys`)
# rides the deprecated `NSUserNotificationCenter` API and is non-functional
# for unbundled CLIs on macOS 12+, so it isn't pulled in there. Windows
# (WSL toast) shells out to `powershell.exe`, also no notify-rust.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[[bin]]
name = "friring-cli"
path = "src/bin/friring-cli.rs"

# Development tool requirements (install with `cargo binstall` or `cargo install`)
[package.metadata.dev-tools]
prek = "0.2.0"
cocogitto = "6.2.0"
cargo-nextest = "0.9.0"
cargo-deny = "0.16.0"
cargo-audit = "0.21.0"
rumdl = "0.1.19"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[dev-dependencies]
# Snapshot assertions for the TUI acceptance tests (src/app/acceptance.rs).
# default-features off keeps the dep tree minimal (just `similar`).
insta = { version = "1.48.0", default-features = false }

# Property/fuzz testing — proves friring's terminal pipeline is byte- and
# render-transparent (control_mode transport + terminal_view rendering). Runs in
# the normal `cargo nextest --all`.
proptest = "1"

# vt100 0.16.2 discards a line that scrolls off the top of the screen whenever
# ANY scrolling region is set — even one anchored at row 1, where every real
# terminal (xterm, tmux, iTerm2) saves it. That is exactly how ratatui's inline
# viewport grows its transcript, so a Codex pane's scrollback stayed empty
# forever and Shift+Up / the wheel / the scrollbar were silent no-ops.
# `panoptes-vt100` is upstream 0.16.2 with that one condition relaxed to
# `scroll_top == 0`; replaying a recorded Codex stream through it yields the
# same 22 scrollback lines tmux itself keeps, against 0 unpatched (pinned by
# `tests::inline_viewport_scrollback` in src/agent/backend.rs).
#
# It has to be a patch rather than a plain dependency: tui-term renders a
# `vt100::Screen`, so both crates must resolve to the SAME vt100 or the types
# don't unify. `[patch]` matches on package name and cannot rename, which is
# what `vendor/vt100` is for — a one-line re-export crate that carries the
# required name; the emulator itself still comes from crates.io. Retire both
# if upstream vt100 ever ships the fix.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
